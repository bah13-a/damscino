# Server overlay: HTTPS with automatic Let's Encrypt certificates, only ports 80/443 exposed.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Required in .env: DOMAIN (e.g. damascino.duckdns.org or 1-2-3-4.sslip.io), secrets (see infra/vps/deploy.sh)
services:
  postgres:
    ports: !reset []
  rabbitmq:
    ports: !reset []
  gateway:
    ports: !reset []
  identity-service:
    environment:
      # real SMS through "SMS Gateway for Android" (docs/SMS.md); the code is never returned to the app
      SMS_PROVIDER: ${SMS_PROVIDER:-android-gateway}
      SMS_EXPOSE_CODES: "false"
      SMS_MAX_PER_IP_HOUR: ${SMS_MAX_PER_IP_HOUR:-30}
  frontend:
    ports: !reset []
    build:
      args:
        NEXT_PUBLIC_ANDROID_APP_URL: ${ANDROID_APP_URL:-/downloads/damascino-privileges.apk}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ./app-downloads:/app/downloads:ro
    depends_on: [frontend]

volumes:
  caddy-data:
  caddy-config:
