server:
  port: ${PORT:8082}

spring:
  application:
    name: partner-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:damascino}?currentSchema=partner${DB_URL_PARAMS:}
    username: ${DB_USER:damascino}
    password: ${DB_PASSWORD:damascino}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    schemas: partner
    default-schema: partner
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info

damascino:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production}
  credentials:
    # encrypts temporary passwords until the beneficiary activates the account (export des accès)
    secret: ${CREDENTIALS_SECRET:dev-only-credentials-secret-change-me}
  import:
    max-rows: 5000
