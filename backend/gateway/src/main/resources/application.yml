server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        # generous: on Render's free plan a sleeping service needs up to a minute to wake up
        response-timeout: 120s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        # The browser only talks to the frontend (same origin, /api proxied by Next.js), which forwards the Origin
        # header of the public address (Codespace, Render, tunnel…). Auth is a bearer token, not a cookie, so any
        # origin can be accepted; set CORS_ORIGINS to restrict it.
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${CORS_ORIGINS:*}
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: '*'
            exposed-headers: Content-Disposition
            max-age: 3600
      routes:
        - id: identity-service
          uri: ${IDENTITY_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/accounts/**,/api/mail-settings,/api/mail-settings/**
        - id: partner-service
          uri: ${PARTNER_URL:http://localhost:8082}
          predicates:
            - Path=/api/partners/**,/api/beneficiaries/**,/api/categories/**
        - id: privilege-service
          uri: ${PRIVILEGE_URL:http://localhost:8083}
          predicates:
            - Path=/api/privileges/**,/api/pos/**,/api/pos-terminals/**,/api/pos-products/**,/api/pos-settings
        - id: reporting-service
          uri: ${REPORTING_URL:http://localhost:8084}
          predicates:
            - Path=/api/reporting/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
