name: Application mobile (APK Android)

# Builds the Android app for one environment and publishes it as a GitHub release:
#   test → app "Privilèges TEST" (tn.damascino.privileges.test), release android-test, file damascino-privileges-test.apk
#   prod → app "Damascino Privilèges" (tn.damascino.privileges), release android-prod, file damascino-privileges.apk
# The two apps can be installed side by side. The test app is rebuilt on every change of mobile/; the production
# app only by hand: Actions → Application mobile (APK Android) → Run workflow → environnement « prod ».
#
# Settings → Environments → test / prod → Environment variables and secrets (created at the first run):
#   variable APP_API_URL           address of the site of that environment (required for prod), e.g.
#                                  https://privileges.damascino.tn
#   variable APP_ALLOW_SERVER_CHANGE  1 = the address can also be changed in the app (never for prod)
#   secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                                  signing key (strongly recommended for prod: required by Google Play, and updates
#                                  must always be signed with the same key); otherwise a test key is used.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement'
        type: choice
        options: [test, prod]
        default: test
      api_url:
        description: "Adresse du site (vide = variable APP_API_URL de l'environnement)"
        required: false

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ inputs.environment || 'test' }}-${{ github.ref }}
  cancel-in-progress: true

# address of the test server when the test environment has no APP_API_URL variable (current Codespace)
env:
  DEFAULT_TEST_API_URL: https://musical-goggles-7wqpvxv5jgq3pvqg-3000.app.github.dev

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'test' }}
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: 1
      APP_ENV: ${{ inputs.environment || 'test' }}
      EXPO_PUBLIC_APP_ENV: ${{ inputs.environment || 'test' }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
    steps:
      - name: Server of the environment
        working-directory: ${{ github.workspace }}
        env:
          INPUT_URL: ${{ inputs.api_url }}
          VAR_URL: ${{ vars.APP_API_URL }}
          VAR_ALLOW: ${{ vars.APP_ALLOW_SERVER_CHANGE }}
        run: |
          URL="${INPUT_URL:-$VAR_URL}"
          if [ "$APP_ENV" = "test" ]; then URL="${URL:-$DEFAULT_TEST_API_URL}"; ALLOW="${VAR_ALLOW:-0}"; else ALLOW=0; fi
          if [ -z "$URL" ]; then
            echo "::error::Définissez la variable APP_API_URL de l'environnement $APP_ENV (Settings → Environments → $APP_ENV)."
            exit 1
          fi
          case "$URL" in https://*) ;; *) echo "::error::APP_API_URL doit commencer par https:// ($URL)"; exit 1 ;; esac
          echo "EXPO_PUBLIC_API_URL=${URL%/}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_ALLOW_SERVER_CHANGE=$ALLOW" >> "$GITHUB_ENV"
          echo "Environnement $APP_ENV → serveur ${URL%/}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/release.keystore
            cat >> android/gradle.properties <<PROPS
          DP_UPLOAD_STORE_FILE=release.keystore
          DP_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD
          DP_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          DP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          PROPS
            node ../.github/scripts/android-release-signing.mjs android/app/build.gradle
            echo "APK signé avec la clé Damascino"
          else
            echo "::warning::Aucune clé de signature : APK signé avec une clé de test (installation directe uniquement)."
          fi
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - name: Collect
        id: apk
        run: |
          FILE=$([ "$APP_ENV" = "prod" ] && echo damascino-privileges.apk || echo damascino-privileges-test.apk)
          cp android/app/build/outputs/apk/release/app-release.apk "../$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          ls -la "../$FILE"
      # an unsigned or truncated APK is refused by Android ("problème lors de l'analyse du package"): never publish one
      - name: Check that the APK is installable
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --verbose "../${{ steps.apk.outputs.file }}"
          "$BT/aapt2" dump badging "../${{ steps.apk.outputs.file }}" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
      # one release per environment, replaced at each build: its download link never changes
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.APP_ENV }}
          name: ${{ env.APP_ENV == 'prod' && 'Damascino Privilèges' || 'Privilèges TEST' }} ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.APP_ENV != 'prod' }}
          make_latest: ${{ env.APP_ENV == 'prod' }}
          files: ${{ steps.apk.outputs.file }}
          overwrite_files: true
          body: |
            Application Android Damascino Privilèges — environnement **${{ env.APP_ENV }}** (bénéficiaires et personnel de caisse).
            Serveur : ${{ env.EXPO_PUBLIC_API_URL }}
            Commit : ${{ github.sha }} · build ${{ github.run_number }}
            Installation : télécharger `${{ steps.apk.outputs.file }}` sur le téléphone, l'ouvrir et autoriser l'installation.
      # production app: put it at once on the server (QR code of the home page); secrets: see deploy.yml
      - name: Publish the APK on the server
        if: env.APP_ENV == 'prod'
        working-directory: ${{ github.workspace }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/server-run.sh <<SCRIPT
          set -euo pipefail
          GITHUB_TOKEN="${RUN_TOKEN}" bash /opt/damascino/infra/download-apk.sh prod < /dev/null
          SCRIPT
