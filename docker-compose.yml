# Local stack: docker compose up --build   →   http://localhost:3000
# (admin / Damascino2026! at first login, password change forced)
# Server with HTTPS: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (see docs/DEPLOIEMENT_GRATUIT.md)

# Small heap per JVM: the whole stack fits in ~3 GB (free Codespace, Oracle Always Free VM, laptop)
x-java-opts: &java-opts "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"

x-backend-env: &backend-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: damascino
  DB_USER: damascino
  DB_PASSWORD: ${DB_PASSWORD:-damascino}
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-change-me-please}
  JAVA_OPTS: *java-opts
  TZ: Africa/Tunis

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: damascino
      POSTGRES_USER: damascino
      POSTGRES_PASSWORD: ${DB_PASSWORD:-damascino}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damascino -d damascino"]
      interval: 5s
      retries: 20

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  identity-service:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 6
    build: { context: ./backend, dockerfile: identity-service/Dockerfile }
    environment:
      <<: *backend-env
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Damascino2026!}
      ADMIN_RESET: ${ADMIN_RESET:-false}
      # test environment: SMS simulated, the code is shown in the app (see docs/SMS.md)
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      SMS_EXPOSE_CODES: ${SMS_EXPOSE_CODES:-true}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-https://api.sms-gate.app/3rdparty/v1}
      SMS_GATEWAY_USER: ${SMS_GATEWAY_USER:-}
      SMS_GATEWAY_PASSWORD: ${SMS_GATEWAY_PASSWORD:-}
      SMS_MAX_PER_IP_HOUR: ${SMS_MAX_PER_IP_HOUR:-1000}
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }

  partner-service:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 6
    build: { context: ./backend, dockerfile: partner-service/Dockerfile }
    environment:
      <<: *backend-env
      CREDENTIALS_SECRET: ${CREDENTIALS_SECRET:-local-credentials-secret-change-me}
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }

  privilege-service:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 6
    build: { context: ./backend, dockerfile: privilege-service/Dockerfile }
    environment:
      <<: *backend-env
      QR_SECRET: ${QR_SECRET:-local-qr-secret-change-me-please}
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }

  reporting-service:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 6
    build: { context: ./backend, dockerfile: reporting-service/Dockerfile }
    environment:
      <<: *backend-env
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }

  gateway:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 6
    build: { context: ./backend, dockerfile: gateway/Dockerfile }
    environment:
      IDENTITY_URL: http://identity-service:8081
      PARTNER_URL: http://partner-service:8082
      PRIVILEGE_URL: http://privilege-service:8083
      REPORTING_URL: http://reporting-service:8084
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JAVA_OPTS: *java-opts
    ports:
      - "8080:8080"
    depends_on:
      identity-service: { condition: service_healthy }
      partner-service: { condition: service_healthy }
      privilege-service: { condition: service_healthy }
      reporting-service: { condition: service_healthy }

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        API_URL: http://gateway:8080
        # test environment (Codespace, local): the test app; docker-compose.prod.yml switches to the production app
        NEXT_PUBLIC_ANDROID_APP_URL: ${ANDROID_APP_URL:-/downloads/damascino-privileges-test.apk}
        NEXT_PUBLIC_IOS_APP_URL: ${IOS_APP_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - app-downloads:/app/downloads
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  pgdata:
  app-downloads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./app-downloads
